<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TERMINATED — a slow-burn psychological horror game about letting an AI assistant run your desktop job." />
    <title>TERMINATED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <section id="hero">
        <div id="hero-canvas"></div>
        <div class="hero-header">
          <p class="genre-label">Psychological Horror &middot; Desktop Sim</p>
        </div>
        <a class="corner-link corner-link-left" href="https://store.steampowered.com/" data-placeholder="steam">
          <img class="corner-link-icon" src="/icons/steam.png" alt="" />
          Wishlist on Steam
        </a>
        <a class="corner-link corner-link-right" href="https://discord.gg/" data-placeholder="discord">
          <img class="corner-link-icon" src="/icons/discord.png" alt="" />
          Join the Discord
        </a>
        <a class="scroll-hint" href="#trailer" aria-label="Scroll down">
          <span>scroll</span>
          <div class="scroll-hint-line"></div>
        </a>
      </section>

      <section id="trailer" class="trailer-section">
        <h1 class="wishlist-title">Wishlist on Steam Now</h1>
        <a class="btn-wishlist" href="https://store.steampowered.com/" data-placeholder="steam">
          <img class="corner-link-icon" src="/icons/steam.png" alt="" />
          Wishlist on Steam
        </a>
        <div class="video-frame">
          <iframe
            src="https://www.youtube.com/embed/REPLACE_WITH_VIDEO_ID"
            title="TERMINATED trailer"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
